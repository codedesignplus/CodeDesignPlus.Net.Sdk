syntax = "proto3";

option csharp_namespace = "CodeDesignPlus.Net.gRpc.Clients.Services.Notification";

package Notifications;

service Notifier {
  //Sent notifications to a specific user identified by their ID.
  rpc SendToUser (stream NotificationUserRequest) returns (stream NotificationResponse);
  //Sends a broadcast notification to all connected users (within a Tenant).
  rpc Broadcast (stream NotificationBroadcastRequest) returns (stream NotificationResponse);
  //Sends notifications to a logical group of connections (e.g., "Administrators", "Project_A").
  rpc SendToGroup (stream NotificationGroupRequest) returns (stream NotificationResponse);
}

message NotificationUserRequest {
  string id = 1;
  //Unique identifier of the target user (GUID or JWT Sub).
  string userId = 2;
  //Name of the event in the frontend (e.g., OrderUpdated).
  string eventName = 3;
  //Serialized JSON object with the notification data.
  string jsonPayload = 4;
  //Identifier of the client/organization for data isolation.
  string tenant = 5;
  //Identifier of the system or user originating the notification.
  string sentBy = 6;
}

message NotificationBroadcastRequest {
  string id = 1;
  //Name of the event that clients should listen to.
  string eventName = 2;
  //Serialized JSON object with the notification data.
  string jsonPayload = 3;
  //Identifier of the client/organization for data isolation.
  string tenant = 4;
  //Identifier of the system or user originating the notification.
  string sentBy = 5;
}

message NotificationGroupRequest {
  string id = 1;
  //Name of the group to which the message will be sent (must match SignalR groups).
  string groupName = 2;
  //Name of the event that clients should listen to.
  string eventName = 3;
  //Serialized JSON object with the notification data.
  string jsonPayload = 4;
  //Identifier of the client/organization for data isolation.
  string tenant = 5;
  //Identifier of the system or user originating the notification.
  string sentBy = 6;
}

message NotificationResponse {
  bool success = 1;
  string message = 2;
}

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Canal efimero. No se persiste, no se replica, no aparece en ninguna bandeja.
// Si el destinatario no esta conectado, el mensaje se pierde — y esta bien.
//
// Antes todo se guardaba: un reparto de cuota extraordinaria de 200 unidades dejaba
// 200 documentos de progreso en Mongo que nadie leia jamas.
// ─────────────────────────────────────────────────────────────────────────────
service LiveChannel {
  rpc PushToUser  (stream LiveUserPush)  returns (stream PushAck);
  rpc PushToGroup (stream LiveGroupPush) returns (stream PushAck);
}

message LiveUserPush {
  string tenant        = 1;
  string userId        = 2;
  //Nombre del evento que el frontend escucha (ej. "charge.generation.progress").
  string eventName     = 3;
  string jsonPayload   = 4;
  //Para correlacionar trazas. No es idempotencia: aqui no hay nada que deduplicar.
  string correlationId = 5;
}

message LiveGroupPush {
  string tenant        = 1;
  //Nombre del grupo sin calificar: el servidor le antepone "Tenant:{tenant}:".
  string groupName     = 2;
  string eventName     = 3;
  string jsonPayload   = 4;
  string correlationId = 5;
}

message PushAck {
  bool   success = 1;
  string message = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Avisos durables. Se persisten, entran a la bandeja y sobreviven al reinicio del
// navegador y del pod. Empujan en vivo ademas, sin que el emisor pida nada.
//
// La pregunta que decide cual usar, por cada punto de llamada:
//   "Le sirve esto a alguien que no estaba mirando la pantalla?"
//   Si -> Inbox.  No -> LiveChannel.
// ─────────────────────────────────────────────────────────────────────────────
service Inbox {
  rpc Notify (stream NotificationRequest) returns (stream NotifyAck);
  //Cierra los avisos de una tarea que ya se hizo: deja de contar como pendiente en la campana de todos.
  rpc Resolve (ResolveRequest) returns (ResolveAck);
}

message NotificationRequest {
  //Generado por el emisor. Es la clave de idempotencia frente a reentregas del bus.
  string   id          = 1;
  string   tenant      = 2;
  Audience audience    = 3;
  //Clave estable del tipo de aviso (ej. "invoice.issued"). Nunca un numero: un identificador
  //que viaja entre microservicios no puede ser la posicion de un enum.
  string   kind        = 4;
  //Respaldo para cuando el frontend no conoce el kind. La verdad es kind + jsonPayload.
  string   title       = 5;
  string   body        = 6;
  //A donde lleva el clic en la bandeja.
  Resource resource    = 7;
  string   jsonPayload = 8;
  string   sentBy      = 9;
  //Cuando ocurrio el hecho, que no es cuando se guardo el aviso.
  google.protobuf.Timestamp occurredAt = 10;
}

message Audience {
  AudienceKind    kind   = 1;
  //userIds si kind es USER; nombres de rol si es ROLE; vacio si es TENANT.
  repeated string values = 2;
}

//La audiencia se guarda como descriptor y se resuelve al LEER. Resolverla al escribir obligaria
//a que cada micro supiera los userIds de un rol —ms-frontdesk conoce la unidad, no el usuario—
//y eso es una llamada cruzada en el path de escritura.
enum AudienceKind {
  AUDIENCE_KIND_UNSPECIFIED = 0;
  AUDIENCE_KIND_USER        = 1;
  AUDIENCE_KIND_ROLE        = 2;
  AUDIENCE_KIND_TENANT      = 3;
}

message Resource {
  //Modulo dueno del dato. El frontend lo traduce a una ruta: las rutas son suyas y cambian sin
  //que el backend se entere.
  string module      = 1;
  string aggregateId = 2;
}

message NotifyAck {
  bool   success        = 1;
  string message        = 2;
  //El id que mando el emisor, para que pueda correlacionar el acuse.
  string notificationId = 3;
}

//La clave de correlacion de un aviso es su tipo mas el recurso al que lleva: el aviso "espera tu
//aprobacion" del documento X se cierra cuando X se aprueba o se rechaza, lo haya leido quien lo haya
//leido. El servicio no sabe nada del producto: solo compara tipo, modulo y agregado.
message ResolveRequest {
  string   tenant      = 1;
  //Los tipos de aviso que se cierran (ej. "expenses.expense_approval_required").
  repeated string kinds = 2;
  Resource resource    = 3;
  //Quien hizo la tarea, o el usuario de sistema.
  string   resolvedBy  = 4;
  //Cuando se hizo. Solo se cierran los avisos de hechos anteriores: uno posterior es otra tarea.
  google.protobuf.Timestamp resolvedAt = 5;
}

message ResolveAck {
  bool   success  = 1;
  string message  = 2;
  //Cuantos avisos ya guardados se cerraron. Cero no es un error: el aviso puede llegar despues, y entonces
  //nace cerrado.
  int64  resolved = 3;
}
